<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meatify - Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background: transparent;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      max-width: 400px;
      width: 90%;
      background: linear-gradient(160deg, #1a1a1a, #0d0d0d);
      border-radius: 24px;
      padding: 2.8rem 2rem 2rem;
      border: 1px solid rgba(212, 175, 55, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo-wrapper {
      width: 80px;
      height: 80px;
      margin-bottom: 1rem;
      flex-shrink: 0;
    }

    .logo {
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #1a0e0a, #2d1810);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(212, 175, 55, 0.2);
    }

    .logo svg {
      width: 38px;
      height: 38px;
      color: #f5e6c8;
    }

    .brand {
      margin-bottom: 0.1rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #f5e6c8, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
    }

    .sub {
      font-size: 0.65rem;
      color: rgba(212, 175, 55, 0.35);
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 500;
      display: block;
      margin-top: 0.05rem;
    }

    .sub::before,
    .sub::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 1px;
      background: rgba(212, 175, 55, 0.15);
      vertical-align: middle;
      margin: 0 8px;
    }

    .progress-container {
      width: 100%;
      margin: 1.2rem 0 0.6rem;
      flex-shrink: 0;
    }

    .progress-bar {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #d4af37;
      border-radius: 2px;
      animation: loadingProgress 2.4s ease-in-out infinite;
    }

    @keyframes loadingProgress {
      0% { width: 0%; }
      50% { width: 100%; }
      100% { width: 0%; }
    }

    .loading-text {
      font-size: 0.8rem;
      font-weight: 400;
      color: rgba(245, 230, 200, 0.5);
      min-height: 1.8rem;
      letter-spacing: 0.2px;
      flex-shrink: 0;
    }

    .loading-text .dot {
      display: inline-block;
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .loading-text .dot:nth-child(2) { animation-delay: 0.2s; }
    .loading-text .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dotPulse {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }
    }

    .migration-status {
      display: none;
      font-size: 0.7rem;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      margin-top: 0.4rem;
      border: 1px solid;
      width: 100%;
      flex-shrink: 0;
    }

    .migration-status.running {
      background: rgba(212, 175, 55, 0.06);
      border-color: rgba(212, 175, 55, 0.15);
      color: rgba(245, 230, 200, 0.7);
    }

    .migration-status.completed {
      background: rgba(16, 185, 129, 0.06);
      border-color: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }

    .migration-status.failed {
      background: rgba(239, 68, 68, 0.06);
      border-color: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .migration-status .icon {
      margin-right: 6px;
    }

    .version {
      margin-top: 1.4rem;
      font-size: 0.55rem;
      color: rgba(245, 230, 200, 0.12);
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .version::before,
    .version::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 1px;
      background: rgba(212, 175, 55, 0.06);
      vertical-align: middle;
      margin: 0 6px;
    }

    /* Ready state - minimal */
    .ready .progress-fill {
      animation: none !important;
      width: 100% !important;
      background: #10b981 !important;
    }

    .ready .loading-text {
      color: #6ee7b7;
    }

    .ready .logo {
      border-color: rgba(16, 185, 129, 0.2);
    }

    /* Responsive */
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.4rem 1.6rem;
        border-radius: 18px;
        width: 92%;
      }
      .logo-wrapper {
        width: 64px;
        height: 64px;
        margin-bottom: 0.7rem;
      }
      .logo svg {
        width: 30px;
        height: 30px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .sub {
        font-size: 0.55rem;
        letter-spacing: 2px;
      }
      .sub::before,
      .sub::after {
        width: 10px;
        margin: 0 5px;
      }
      .progress-container {
        margin: 0.8rem 0 0.4rem;
      }
      .loading-text {
        font-size: 0.7rem;
        min-height: 1.5rem;
      }
      .version {
        margin-top: 1rem;
        font-size: 0.5rem;
      }
    }

    @media (max-width: 360px) {
      .container {
        padding: 1.5rem 1rem 1.2rem;
        border-radius: 14px;
      }
      .logo-wrapper {
        width: 54px;
        height: 54px;
        margin-bottom: 0.5rem;
      }
      .logo svg {
        width: 26px;
        height: 26px;
      }
      h1 {
        font-size: 1.3rem;
      }
      .sub {
        font-size: 0.45rem;
        letter-spacing: 1.5px;
      }
      .sub::before,
      .sub::after {
        width: 8px;
        margin: 0 4px;
      }
      .progress-bar {
        height: 2px;
      }
      .loading-text {
        font-size: 0.6rem;
        min-height: 1.2rem;
      }
      .version {
        margin-top: 0.8rem;
        font-size: 0.45rem;
      }
      .version::before,
      .version::after {
        width: 10px;
      }
    }

    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

  <div class="container" id="app-container">

    <!-- Logo -->
    <div class="logo-wrapper">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 9.5 L19.5 4.5 C20.2 3.8 21.3 3.8 22 4.5 C22.7 5.2 22.7 6.3 22 7 L17 12"/>
          <path d="M12 14 L6 20 C5.3 20.7 4.2 20.7 3.5 20 C2.8 19.3 2.8 18.2 3.5 17.5 L9.5 11.5"/>
          <path d="M12 14 L9 17"/>
          <path d="M15 11 L18 8"/>
          <path d="M10 16 L7 19"/>
          <path d="M5.5 18.5 L3.5 16.5"/>
          <path d="M8 10 C9 8 12 7 14 8 C16 9 17 12 16 14 C15 16 12 17 10 16 C8 15 7 12 8 10Z" stroke-width="1.2"/>
          <path d="M10 11 L13 11 M11 13 L12 13" stroke-width="1.5"/>
        </svg>
      </div>
    </div>

    <!-- Brand -->
    <div class="brand">
      <h1>Meatify</h1>
      <span class="sub">Premium Meat POS</span>
    </div>

    <!-- Progress -->
    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Loading Text -->
    <div class="loading-text" id="loading-text">
      <span>Initializing</span>
      <span class="dot">.</span>
      <span class="dot">.</span>
      <span class="dot">.</span>
    </div>

    <!-- Migration Status -->
    <div class="migration-status" id="migration-status">
      <span class="icon" id="migration-icon">⏳</span>
      <span id="migration-message"></span>
    </div>

    <!-- Version -->
    <div class="version" id="version-text">v1.0.9</div>
  </div>

  <script>
    (function() {
      const loadingMessages = [
        "Preparing meat inventory",
        "Connecting to database",
        "Loading batch system",
        "Initializing FIFO engine",
        "Setting up scales",
        "Almost ready",
        "Welcome to Meatify!"
      ];

      let step = 0;
      const loadingEl = document.getElementById("loading-text");
      const progressFill = document.getElementById("progress-fill");
      const migrationStatusDiv = document.getElementById("migration-status");
      const migrationMsgSpan = document.getElementById("migration-message");
      const migrationIcon = document.getElementById("migration-icon");
      const container = document.getElementById("app-container");

      let msgInterval = setInterval(() => {
        if (migrationStatusDiv.style.display === "block") return;
        loadingEl.style.opacity = "0.3";
        setTimeout(() => {
          step = (step + 1) % loadingMessages.length;
          const msg = loadingMessages[step];
          loadingEl.innerHTML = msg + 
            '<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
          loadingEl.style.opacity = "1";
        }, 150);
      }, 2200);

      function handleMigrationStatus(data) {
        clearInterval(msgInterval);
        migrationStatusDiv.style.display = "block";

        if (data.status === "running") {
          migrationStatusDiv.className = "migration-status running";
          migrationIcon.textContent = "⏳";
          migrationMsgSpan.textContent = data.message || "Updating database structure...";
          loadingEl.innerHTML = "Applying updates<span class='dot'>.</span><span class='dot'>.</span><span class='dot'>.</span>";
          progressFill.style.animation = "loadingProgress 1.5s ease-in-out infinite";
        } 
        else if (data.status === "completed") {
          migrationStatusDiv.className = "migration-status completed";
          migrationIcon.textContent = "✓";
          migrationMsgSpan.textContent = data.message || "Database update completed";
          loadingEl.innerHTML = "Ready ✓";
          loadingEl.style.color = "#6ee7b7";
          progressFill.style.animation = "none";
          progressFill.style.width = "100%";
          container.classList.add("ready");
        } 
        else if (data.status === "failed") {
          migrationStatusDiv.className = "migration-status failed";
          migrationIcon.textContent = "✕";
          migrationMsgSpan.textContent = data.message || "Migration failed";
          loadingEl.innerHTML = "Database issue detected";
          loadingEl.style.color = "#fca5a5";
        }
      }

      if (window.backendAPI && typeof window.backendAPI.on === 'function') {
        window.backendAPI.on("migration:status", (event, data) => {
          handleMigrationStatus(data);
        });
      } else {
        if (process.env.NODE_ENV === 'development') {
          setTimeout(() => {
            handleMigrationStatus({ 
              status: "completed", 
              message: "Database ready" 
            });
          }, 3000);
        }
      }

      if (window.backendAPI && typeof window.backendAPI.getAppVersion === 'function') {
        window.backendAPI.getAppVersion().then(version => {
          if (version) {
            document.getElementById("version-text").textContent = 'v' + version;
          }
        }).catch(() => {});
      }

      console.log('🥩 Meatify splash screen loaded');
    })();
  </script>
</body>
</html>
